# Header (non-billable) ICD-10-CM codes used to simulate invalid principal diagnoses
invalid_dx_headers: [M545, E11, M2320]

# Medical-necessity support: code group -> strong / weak diagnoses.
# A diagnosis not listed for a code group is "none" (unsupported) unless the group is `any`.
support:
  em_low:   {codes: ["99202", "99203", "99212", "99213", "96372", "99283", "99284"], any: true}
  em_high:  {codes: ["99204", "99214", "99215", "99285"], weak: [J069, J029, J301, L309, S93401A, R519], any: true}
  lab_general: {codes: ["36415", "80053", "80048", "85025"], any: true}
  hba1c:    {codes: ["83036"], strong: [E119, R7303], weak: [E785, I10, R5383, Z0000]}
  lipids:   {codes: ["80061"], strong: [E785, I10, E119], weak: [R5383, Z0000, R7303]}
  tsh:      {codes: ["84443"], strong: [E039], weak: [R5383, Z0000, D649]}
  urinalysis: {codes: ["81001"], strong: [N390, N23, E119], weak: [R109, R5383, Z0000]}
  mri_lumbar: {codes: ["72148"], strong: [M5416], weak: [M5450]}
  mri_brain:  {codes: ["70551"], strong: [G43909], weak: [R519]}
  mri_knee:   {codes: ["73721"], strong: [S83241A, M23205], weak: [M25561]}
  ct_abdomen: {codes: ["74177"], strong: [N23, K8020], weak: [R109]}
  chest_xray: {codes: ["71046"], strong: [J189, R059, R079, R0789], weak: [R509]}
  us_abdomen: {codes: ["76700"], strong: [K8020, R109], weak: [N23]}
  physio:   {codes: ["97161", "97162", "97110", "97140", "97112", "97530", "97035"], strong: [M5416, M75101, S93401A, S83241A, Z4789, M6281], weak: [M5450, M25561, M542]}
