# Code catalogue for the simulator.
# - CPT/HCPCS codes: codes only (no AMA descriptors). Every CPT code below is checked
#   against the CMS NCCI MUE table by tests/test_reference.py.
# - ICD-10-CM codes: written without the dot, checked against the CMS FY2027 order file
#   (must exist and be billable, except `invalid_dx_headers`, which must be non-billable).
# - Prices (AED) are SIMULATED round numbers. They are not the DHA mandatory tariff.
# - Drug codes are SIMULATED (prefix SIM-). They are not real DHA drug codes.

service_lines:
  outpatient:
    label: Outpatient consultation
    weight: 0.36
    specialty: [family_medicine, internal_medicine]
  emergency:
    label: Emergency
    weight: 0.10
    specialty: [emergency_medicine]
  laboratory:
    label: Laboratory
    weight: 0.18
    specialty: [pathology]
  radiology:
    label: Radiology
    weight: 0.10
    specialty: [radiology]
  physiotherapy:
    label: Physiotherapy
    weight: 0.10          # share of claims; generated as multi-session episodes
    specialty: [physiotherapy]
  pharmacy:
    label: Pharmacy
    weight: 0.12
    specialty: [family_medicine, internal_medicine]
  day_surgery:
    label: Day surgery
    weight: 0.05
    specialty: [general_surgery, gastroenterology, orthopaedics, ophthalmology]

